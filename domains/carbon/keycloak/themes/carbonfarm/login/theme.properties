# Theme trang đăng nhập của miền carbon (CarbonFarm OS). Kế thừa theme keycloak.v2 có sẵn trong Keycloak, chỉ thêm CSS,
# ảnh và câu chữ; không chép template của Keycloak. Tầng 1 chép thư mục này vào Keycloak lúc khởi động
# (compose/platform.yaml); nap-nguoi-dung.sh đặt loginTheme=carbonfarm cho realm dxos.
parent=keycloak.v2
import=common/keycloak
# styles.css của keycloak.v2 trước, CSS thương hiệu sau để ghi đè
styles=css/styles.css css/carbonfarm.css
# Luôn dùng nền sáng (keycloak.v2 tự đổi sang nền tối theo máy)
darkMode=false
