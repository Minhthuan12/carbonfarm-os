# Lint của app di động: bộ luật khuyến nghị của Flutter (flutter_lints). Kiểm bằng `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    prefer_single_quotes: true
