# Đăng trang tài liệu (docs-site/, Starlight) lên GitHub Pages mỗi khi main thay đổi tài liệu (ADR 0008).
name: tai-lieu
on:
  push:
    branches: [main]
    paths: ["docs/**", "methodology/**", "README.md", "docs-site/**", ".github/workflows/tai-lieu.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - id: dang
        uses: actions/deploy-pages@v4
