# CI trên mọi PR vào main: task check (SPDX + compose), task lint, web, app di động, trang tài liệu.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # tránh giới hạn API khi tải go-task
      - name: Công cụ lint
        run: pip install yamllint ruff httpx==0.28.1 -r connectors/requirements.txt  # httpx: kiểm thử dang_ky_stac
      - name: task check
        run: task check
      - name: task lint
        run: task lint
      - name: task test
        run: task test

  web:
    # Web Tầng 2 (SvelteKit): cài theo lockfile, svelte-check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: domains/carbon/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: domains/carbon/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  di-dong:
    # App di động Flutter (domains/carbon/di-dong, ADR 0009): analyze, test, build APK release trên runner Ubuntu
    # (Android SDK có sẵn; máy dev không cài SDK). APK tải lên artifact "carbonfarm-apk" để cài thử.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: domains/carbon/di-dong
    steps:
      - uses: actions/checkout@v4
      # JDK 21: lint của Android Gradle Plugin (camera_android_camerax) gọi List.removeLast(), API chỉ có từ JDK 21
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # subosito/flutter-action (MIT) ghim theo commit của tag v2.23.0; Flutter ghim 3.50.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: carbonfarm-apk
          path: domains/carbon/di-dong/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  tai-lieu:
    # Trang tài liệu Starlight (docs-site/): chép nội dung từ docs/ rồi build HTML tĩnh
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
