# CI trên mọi PR vào main: task check (SPDX + compose), task lint, web, app di động, trang tài liệu.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # tránh giới hạn API khi tải go-task
      - name: Công cụ lint
        run: pip install yamllint ruff httpx==0.28.1 -r connectors/requirements.txt  # httpx: kiểm thử dang_ky_stac
      - name: task check
        run: task check
      - name: task lint
        run: task lint
      - name: task test
        run: task test

  web:
    # Web Tầng 2 (SvelteKit): cài theo lockfile, svelte-check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: domains/carbon/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: domains/carbon/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  di-dong:
    # App di động Flutter (domains/carbon/di-dong, ADR 0009): analyze, test, build APK (Android SDK có sẵn trên runner)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: domains/carbon/di-dong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

  tai-lieu:
    # Trang tài liệu Starlight (docs-site/): chép nội dung từ docs/ rồi build HTML tĩnh
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
